# A hang should report, not stall.
#
# Every loop in the engine is bounded by a count, so a test that does not
# return is a bug; terminating turns it into a legible failure with a test
# name on it rather than a stalled CI job.
#
# The threshold has to clear the slowest *honest* test by a wide margin, and
# that bar is higher than it looks: a design over the 200-variable beam pays
# the walker's burn-in, which is genuinely expensive. A 30s limit sat close
# enough to flag honest tests as slow, which trains people to ignore the
# warning. 60s leaves real headroom while still bounding a hang.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

# Nextest checks, briefly, whether a finished test still holds its output pipes,
# which would mean it left a child running. The default 100ms grace period is
# tight enough that a pure-string test came back "leaky" under full-suite load
# on Windows — 0.35s there against 0.019s in isolation, on a test that spawns
# nothing at all. A false positive here is worse than useless, because the
# warning that matters is a genuinely unjoined thread.
leak-timeout = "500ms"

# The brute-squad fixtures measure wall clock against a budget and expect the
# whole machine: two of them at once would each see half of it and fail budgets
# they would meet alone. Serialise them against everything else.
[[profile.default.overrides]]
filter = 'binary(brute_squad)'
threads-required = 'num-cpus'

# `just smoke-rlimit`: each test is a call stalled on purpose, which the
# computation limit should end in seconds (tests/smoke_rlimit.rs). A stall the
# limit misses must fail here rather than wait out the default profile's two
# minutes, so the backstop is one period of thirty seconds.
[profile.smoke-rlimit]
slow-timeout = { period = "30s", terminate-after = 1 }
