[package]
name = "sojourn"
version = "0.3.1"
edition = "2024"
description = "Constrained random vector generation over a small expression language"
license = "Apache-2.0"

[dependencies]
antlr-rust-runtime = "0.34"
askama = "0.16"
# The local solve that finds the search's first point: COBYLA, derivative-free,
# with nonlinear inequality constraints in babel's own `<= 0` convention. Pure
# Rust, no C toolchain, which is the whole reason it and not `nlopt`.
basin = "1.14"
faer = { version = "0.24.4", default-features = false, features = ["std"] }
pollster = { version = "1.0.1", optional = true }
# Explicit SIMD for the evaluator's tile kernels, with the instruction set
# chosen at run time. The features mirror faer's exactly so that there is one
# pulp in the build; `x86-v4` (AVX-512) is deliberately off, because feature
# unification would switch faer to it too — a later, measured experiment.
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"] }
rand = "0.10"
# One way of spelling an error: `SystemError` and `RepairError` derive their
# `Display` rather than hand-writing it.
thiserror = "2.0"
# Diagnosis, not logging. The search falls back to brute force whenever
# interval reasoning concludes nothing, and without this there is no way for
# a caller to learn that happened or why. Compiles to nothing without a
# subscriber.
tracing = "0.1"
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl", "vulkan", "dx12", "metal"], optional = true }

[build-dependencies]
antlr-rust-codegen = "0.34"

[dev-dependencies]
anyhow = "1.0"
# Reads the engine's own `tracing` in a test: `RUST_LOG=sojourn=debug` and a
# stage-by-stage account of a repair or an opening comes out on stderr.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
naga = { version = "30.0.1", features = ["wgsl-in"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[features]
default = []
# The GPU sieve: wgpu plus the blocking adapter/device requests. Opt-in, as a
# library's use of a GPU should be: it is heavy to compile, it opens a device
# on the machine, and a search can hold the GPU flat out for seconds. Without
# it brute force runs on the CPU threads, which is also the reference path.
gpu = ["dep:wgpu", "dep:pollster"]
